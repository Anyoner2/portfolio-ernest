<svg xmlns="http://www.w3.org/2000/svg" width="600" height="600" viewBox="0 0 600 600" fill="none">
  <rect width="100%" height="100%" fill="none"/>
  <g transform="translate(100,60) scale(0.72)" fill="currentColor">
    <!-- Head -->
    <ellipse cx="226" cy="90" rx="44" ry="50" fill="currentColor"/>
    <!-- Shoulders / torso (simple rounded shape) -->
    <path d="M90 170 C90 130, 360 130, 360 170 L360 260 C360 300, 90 300, 90 260 Z" fill="currentColor"/>
    <!-- Arms reaching to laptop -->
    <path d="M110 180 C80 200, 70 230, 90 250 C120 275, 180 270, 210 250" stroke="currentColor" stroke-width="18" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <path d="M340 180 C370 200, 380 230, 360 250 C330 275, 270 270, 240 250" stroke="currentColor" stroke-width="18" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <!-- Simple laptop base -->
    <rect x="120" y="295" width="260" height="22" rx="3" fill="currentColor"/>
    <rect x="92" y="318" width="316" height="10" rx="2" fill="currentColor"/>
    <rect x="120" y="235" width="260" height="70" rx="8" fill="currentColor"/>
    <!-- Screen cutout (slightly lighter) -->
    <rect x="140" y="255" width="220" height="40" rx="4" fill="#F7F4EE"/>
    <!-- Keyboard area lines -->
    <path d="M140 305 L360 305" stroke="#F7F4EE" stroke-width="2"/>
  </g>
</svg>
