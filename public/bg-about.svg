<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" preserveAspectRatio="none">
  <defs>
    <pattern id="grid" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M 60 0 L 0 0 0 60" fill="none" stroke="currentColor" stroke-width="1" opacity="0.1"/>
    </pattern>
  </defs>
  
  <!-- Grid pattern background -->
  <rect width="800" height="600" fill="url(#grid)"/>
  
  <!-- Abstract tech shapes -->
  <circle cx="100" cy="80" r="45" fill="currentColor" opacity="0.08"/>
  <circle cx="700" cy="150" r="60" fill="currentColor" opacity="0.06"/>
  <circle cx="150" cy="500" r="55" fill="currentColor" opacity="0.07"/>
  
  <!-- Lines and accent elements -->
  <line x1="0" y1="150" x2="800" y2="150" stroke="currentColor" stroke-width="1" opacity="0.05"/>
  <line x1="0" y1="300" x2="800" y2="300" stroke="currentColor" stroke-width="1" opacity="0.05"/>
  <line x1="0" y1="450" x2="800" y2="450" stroke="currentColor" stroke-width="1" opacity="0.05"/>
  
  <!-- Geometric accents -->
  <rect x="50" y="250" width="120" height="120" fill="none" stroke="currentColor" stroke-width="2" opacity="0.08" transform="rotate(22 110 310)"/>
  <rect x="650" y="320" width="100" height="100" fill="none" stroke="currentColor" stroke-width="2" opacity="0.06" transform="rotate(-18 700 370)"/>
  
  <!-- Tech nodes (dots with connecting lines) -->
  <circle cx="200" cy="200" r="4" fill="currentColor" opacity="0.12"/>
  <circle cx="350" cy="280" r="4" fill="currentColor" opacity="0.12"/>
  <circle cx="500" cy="350" r="4" fill="currentColor" opacity="0.12"/>
  <line x1="200" y1="200" x2="350" y2="280" stroke="currentColor" stroke-width="1" opacity="0.04"/>
  <line x1="350" y1="280" x2="500" y2="350" stroke="currentColor" stroke-width="1" opacity="0.04"/>
</svg>
